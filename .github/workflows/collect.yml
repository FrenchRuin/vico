# A-01 수집: 3시간마다, projects.json이 main에 바뀔 때, 수동으로.
# 바뀐 경우에만 데이터 커밋을 배포 키로 main에 push한다 (Ruleset bypass, spec.md 7절).
name: collect

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
    paths: [projects.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # 배포 키로 체크아웃해야 이 키로 push할 수 있다.
          ssh-key: ${{ secrets.VICO_DEPLOY_KEY }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect
        run: pnpm collect
        env:
          GITHUB_TOKEN: ${{ secrets.VICO_BOT_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/projects.data.json && \
             [ -z "$(git ls-files --others --exclude-standard -- data/projects.data.json)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/projects.data.json
          git commit -m 'chore(data): update projects data'
          git push origin HEAD:main
