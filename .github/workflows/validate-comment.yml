# A-03 등록 검증 (2/2). validate 결과 artifact를 받아 PR 코멘트를 작성/갱신한다.
# 코드는 체크아웃하지 않는다. artifact 내용은 믿지 않는 데이터로 다룬다:
# - PR 번호는 숫자인지, 그 PR의 head가 이 실행의 head_sha와 같은지 확인한다.
# - 본문은 파일로만 넘긴다 (셸에 끼워 넣지 않는다).
name: validate-comment

on:
  workflow_run:
    workflows: [validate]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: validate-result
          path: ${{ runner.temp }}/validate
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Comment on PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          dir="$RUNNER_TEMP/validate"
          pr="$(tr -d '[:space:]' < "$dir/pr-number.txt")"
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            echo "PR 번호가 숫자가 아니에요"; exit 1
          fi
          pr_head="$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)"
          if [ "$pr_head" != "$HEAD_SHA" ]; then
            echo "PR head가 이 실행과 달라요 (새 push가 있었을 수 있음). 건너뜀"; exit 0
          fi
          body="$dir/result.md"
          comment_id="$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- vico-validate -->")))][0].id // empty' | head -n1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$comment_id" -F "body=@$body" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$pr/comments" -F "body=@$body" > /dev/null
          fi
