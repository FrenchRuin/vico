# A-04 리마인더와 정리 + A-05 매일 다시 빌드. 매일 KST 0시 5분 (UTC 15:05).
name: maintain

on:
  schedule:
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reminders and cleanup
        run: pnpm maintain --apply
        env:
          # 이슈와 정리 PR은 봇 토큰으로 만든다 (GITHUB_TOKEN으로 만든 PR에서는 ci가 돌지 않음).
          GITHUB_TOKEN: ${{ secrets.VICO_BOT_TOKEN }}
      - name: Rebuild site (A-05)
        if: always()
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$CF_DEPLOY_HOOK_URL" ]; then
            echo "CF_DEPLOY_HOOK_URL이 없어 다시 빌드를 건너뜀"; exit 0
          fi
          curl -fsS -X POST "$CF_DEPLOY_HOOK_URL" > /dev/null
          echo "Cloudflare Pages 다시 빌드 요청함"
